name: Build Custom Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  build-and-push:
    name: Build & Push Custom Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Log in to Docker Hub BEFORE buildx setup: the builder container
      # (moby/buildkit) and all base images are then pulled authenticated,
      # avoiding anonymous rate limits (429) and timeouts.
      # Skipped automatically when the secrets are not configured.
      - name: Log in to Docker Hub (avoids anonymous rate limits)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pre-pull builder images with retries and mirror fallback:
      # setup-qemu/setup-buildx pull these without retry logic, and
      # auth.docker.io intermittently times out from GitHub runner networks.
      # Once present locally, the setup steps skip the registry entirely.
      - name: Pre-pull builder images (with retries and mirror fallback)
        run: |
          set -u
          pull_image() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                echo "Pulled $image from docker.io"
                return 0
              fi
              echo "Attempt $attempt for $image failed, retrying in 15s..."
              sleep 15
            done
            # Fallback: Google's Docker Hub mirror, then retag to the
            # original name so the setup steps find it locally.
            local mirror="mirror.gcr.io/${image}"
            echo "Falling back to $mirror ..."
            if docker pull "$mirror"; then
              docker tag "$mirror" "$image"
              echo "Pulled $image via mirror.gcr.io"
              return 0
            fi
            echo "ERROR: failed to pull $image (docker.io and mirror.gcr.io)"
            return 1
          }
          pull_image "moby/buildkit:buildx-stable-1"
          pull_image "tonistiigi/binfmt:latest"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Use Google's Docker Hub mirror as fallback for base image pulls
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
