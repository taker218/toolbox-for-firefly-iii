name: Build Custom Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  build-and-push:
    name: Build & Push Custom Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Log in to Docker Hub to raise pull rate limits. Non-fatal:
      # when auth.docker.io is unreachable (recurrent timeouts from
      # GitHub runner networks), the build continues anonymously and
      # the pre-pull step below falls back to the gcr mirror.
      - name: Log in to Docker Hub (avoids anonymous rate limits)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pre-pull builder images: mirror.gcr.io first (no Docker Hub
      # dependency at all), docker.io only as fallback. Once present
      # locally, the setup steps skip the registry entirely.
      - name: Pre-pull builder images (gcr mirror first, docker.io fallback)
        run: |
          set -u
          pull_image() {
            local image="$1"
            local mirror="mirror.gcr.io/${image}"
            if docker pull "$mirror"; then
              docker tag "$mirror" "$image"
              echo "Pulled $image via mirror.gcr.io"
              return 0
            fi
            echo "Mirror failed for $image, falling back to docker.io..."
            for attempt in 1 2; do
              if docker pull "$image"; then
                echo "Pulled $image from docker.io"
                return 0
              fi
              if [ "$attempt" -eq 2 ]; then break; fi
              echo "Attempt $attempt failed, retrying in 15s..."
              sleep 15
            done
            echo "ERROR: failed to pull $image (mirror.gcr.io and docker.io)"
            return 1
          }
          pull_image "moby/buildkit:buildx-stable-1"
          pull_image "tonistiigi/binfmt:latest"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Use Google's Docker Hub mirror as fallback for base image pulls
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
